# Read Talk Pray. Do not link this repository to the Sending Church Netlify site.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/app"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
